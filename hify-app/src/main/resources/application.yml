# Hify local/development defaults. Connection credentials are read from
# environment variables (MYSQL_HOST etc.) and fall back to localhost defaults;
# override them via env vars or by editing this file for local dev.
server:
  port: 8080

spring:
  application:
    name: hify
  datasource:
    mysql:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hify}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:gao5219999}
      hikari:
        pool-name: hify-mysql
        maximum-pool-size: 10
    pgvector:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DATABASE:hify}
      username: ${PG_USERNAME:postgres}
      password: ${PG_PASSWORD:370828}
      hikari:
        pool-name: hify-pgvector
        maximum-pool-size: 5
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      # connect-timeout / lettuce pool tuning goes here when needed

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # Primary keys are bigint auto-increment (BaseEntity carries @TableId too)
      id-type: auto
      # Logical delete convention: deleted tinyint, 1 = deleted, 0 = normal.
      # Fields named `deleted` are excluded from queries automatically.
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Resilience4j circuit breaker defaults per CLAUDE.md. One breaker instance
# per provider is created at runtime via CircuitBreakerRegistry; the `default`
# config here applies to all of them (see CircuitBreakerService).
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

# Chat engine (hify-chat).
hify:
  knowledge:
    upload-dir: ${HIFY_UPLOAD_DIR:./upload}
    vector-dimension: 1536
    chunk-size: 512
    chunk-overlap: 64
    processing-timeout: 10m
    recovery-limit: 100
    embedding:
      model-config-id: ${EMBEDDING_MODEL_CONFIG_ID:2}
      timeout: 30s
      batch-size: 100
  chat:
    # SseEmitter timeout. Must exceed the 60s conversation budget so the
    # business timeout fires first and closes the stream cleanly; the container
    # default (30s on Tomcat) would otherwise cut long replies short.
    sse-timeout-ms: 65000
    # TTL of the context window cache, key = session:{sessionId}.
    context-ttl: 2h
